<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Happy 10 Months, Dolgah & Lewis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .hidden { opacity: 0; }
        .fade-in { animation: fadeIn 2s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .fade-out { animation: fadeOut 1s ease forwards; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .pulse { animation: pulse 2s ease-in-out infinite; }
        @keyframes floatUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .float-up { animation: floatUp 1.5s ease forwards; }
        @keyframes heartBeat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.1); } 28% { transform: scale(1); } 42% { transform: scale(1.1); } }
        .heart-beat { animation: heartBeat 1.5s ease-in-out infinite; }
        @keyframes shimmer { 0% { text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493; } 50% { text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493, 0 0 60px #ff1493; } 100% { text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493; } }
        .shimmer { animation: shimmer 2s ease-in-out infinite; }
        @keyframes typewriter { from { width: 0; } to { width: 100%; } }
        .typewriter { overflow: hidden; white-space: nowrap; animation: typewriter 3s steps(40) forwards; }
        @keyframes glowPulse { 0%, 100% { box-shadow: 0 0 20px rgba(255, 20, 147, 0.5); } 50% { box-shadow: 0 0 40px rgba(255, 20, 147, 0.8), 0 0 60px rgba(255, 105, 180, 0.4); } }

        .countdown-text {
            font-size: 120px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493, 0 0 80px #ff1493;
            letter-spacing: 10px;
        }
        .date-text {
            font-size: 60px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 15px #ff69b4, 0 0 30px #ff1493;
            letter-spacing: 8px;
        }
        .months-text {
            font-size: 70px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 15px #ff69b4, 0 0 30px #ff1493, 0 0 50px #ff1493;
        }
        .name-text {
            font-size: 80px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493, 0 0 60px #ff1493;
            letter-spacing: 15px;
        }
        .message-text {
            font-size: 28px;
            color: #fff;
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493;
            max-width: 80%;
            text-align: center;
            line-height: 1.6;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            border: 1px solid rgba(255, 105, 180, 0.3);
        }
        .heart-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .heart-svg {
            width: 350px;
            height: 350px;
            filter: drop-shadow(0 0 20px #ff1493) drop-shadow(0 0 40px #ff69b4);
        }
        .heart-svg path {
            fill: none;
            stroke: #ff1493;
            stroke-width: 3;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawHeart 3s ease forwards;
        }
        @keyframes drawHeart { to { stroke-dashoffset: 0; } }
        .heart-fill {
            fill: rgba(255, 20, 147, 0.3);
            animation: fillHeart 2s ease 2s forwards;
            opacity: 0;
        }
        @keyframes fillHeart { to { opacity: 1; } }
        .names-in-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 15px #ff1493, 0 0 30px #ff69b4;
            white-space: nowrap;
            opacity: 0;
            animation: fadeIn 2s ease 3s forwards;
        }
        .final-message {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #ffb6c1;
            text-shadow: 0 0 10px #ff1493;
            text-align: center;
            opacity: 0;
            animation: floatUp 2s ease 4s forwards;
        }
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493;
            animation: sparkleAnim 1.5s ease forwards;
        }
        @keyframes sparkleAnim {
            0% { opacity: 1; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0) translateY(-50px); }
        }
        .ten-badge {
            font-size: 100px;
            font-weight: bold;
            color: #ff1493;
            text-shadow: 0 0 30px #ff1493, 0 0 60px #ff69b4;
        }
        .months-label {
            font-size: 50px;
            color: #ffb6c1;
            text-shadow: 0 0 15px #ff1493;
            margin-top: -10px;
        }
        .quote-text {
            font-size: 22px;
            color: #ffc0cb;
            text-shadow: 0 0 8px #ff69b4;
            font-style: italic;
            max-width: 75%;
            text-align: center;
            line-height: 1.8;
        }
        @media (max-width: 768px) {
            .countdown-text { font-size: 80px; }
            .date-text { font-size: 40px; }
            .months-text { font-size: 50px; }
            .name-text { font-size: 50px; letter-spacing: 8px; }
            .message-text { font-size: 20px; max-width: 90%; }
            .heart-svg { width: 250px; height: 250px; }
            .names-in-heart { font-size: 24px; }
            .ten-badge { font-size: 70px; }
            .months-label { font-size: 35px; }
            .quote-text { font-size: 18px; }
            .final-message { font-size: 18px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div id="overlay">
        <!-- Scene 1: Countdown -->
        <div id="scene-countdown" class="hidden">
            <div class="countdown-text" id="countdown-num">3</div>
        </div>

        <!-- Scene 2: Start Date -->
        <div id="scene-startdate" class="hidden">
            <div class="date-text" id="start-date">22.02.08</div>
        </div>

        <!-- Scene 3: Current Date -->
        <div id="scene-currdate" class="hidden">
            <div class="date-text" id="curr-date">29.06.07</div>
        </div>

        <!-- Scene 4: 10 Months -->
        <div id="scene-months" class="hidden">
            <div class="ten-badge">10</div>
            <div class="months-label">Months</div>
        </div>

        <!-- Scene 5: Names -->
        <div id="scene-names" class="hidden">
            <div class="name-text">LEWIS & DOLGAH</div>
        </div>

        <!-- Scene 6: Messages -->
        <div id="scene-messages" class="hidden">
            <div class="message-text" id="message-display"></div>
        </div>

        <!-- Scene 7: Heart -->
        <div id="scene-heart" class="hidden heart-container">
            <svg class="heart-svg" viewBox="0 0 100 100">
                <path class="heart-fill" d="M50,85 C50,85 20,60 20,40 C20,25 30,15 42,15 C47,15 50,20 50,20 C50,20 53,15 58,15 C70,15 80,25 80,40 C80,60 50,85 50,85 Z"/>
                <path d="M50,85 C50,85 20,60 20,40 C20,25 30,15 42,15 C47,15 50,20 50,20 C50,20 53,15 58,15 C70,15 80,25 80,40 C80,60 50,85 50,85 Z"/>
            </svg>
            <div class="names-in-heart">Lewis ❤️ Dolgah</div>
            <div class="final-message">Happy 10 Months, My Love!<br>Here's to forever together 💖</div>
        </div>
    </div>

    <script>
        // ===================== MATRIX RAIN =====================
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        let w, h;
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789❤️💕💖💗💘💝💞💟♥♡LOVEDOLGAHLEWIS10MONTHSFOREVER";
        const fontSize = 16;
        let columns;
        let drops = [];

        function initMatrix() {
            columns = Math.floor(w / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }
        }
        initMatrix();
        window.addEventListener('resize', initMatrix);

        // Scene control
        let currentScene = 0;
        let sceneStartTime = 0;
        let isHeartScene = false;
        let heartParticles = [];

        const scenes = [
            { id: 'scene-countdown', duration: 3500 },
            { id: 'scene-startdate', duration: 3000 },
            { id: 'scene-currdate', duration: 3000 },
            { id: 'scene-months', duration: 3500 },
            { id: 'scene-names', duration: 3500 },
            { id: 'scene-messages', duration: 25000 },
            { id: 'scene-heart', duration: 20000 }
        ];

        const messages = [
            "Happy 10 months, my love! ❤️",
            "Thank you for loving me for these amazing 10 months.",
            "Every moment with you has been a beautiful memory.",
            "You make my life happier every single day.",
            "Thank you for always being there for me through everything.",
            "I appreciate your love, care, and support more than words can express.",
            "You are my favorite person, and I'm so lucky to have you.",
            "I can't wait to create more beautiful memories with you in the months and years ahead.",
            "No matter what happens, my love for you keeps growing stronger every day.",
            "Here's to our 10 months together and to many more happy moments. I love you so much! 💖"
        ];

        let messageIndex = 0;
        let messageStartTime = 0;
        const MESSAGE_DISPLAY_TIME = 2500;

        function showScene(index) {
            // Hide all scenes
            document.querySelectorAll('#overlay > div').forEach(div => {
                div.classList.add('hidden');
                div.classList.remove('fade-in', 'pulse', 'float-up', 'heart-beat', 'shimmer');
            });

            if (index >= scenes.length) {
                index = scenes.length - 1;
                currentScene = index;
            }

            const scene = document.getElementById(scenes[index].id);
            if (!scene) return;

            scene.classList.remove('hidden');
            scene.classList.add('fade-in');

            // Add special effects based on scene
            if (scenes[index].id === 'scene-months') {
                scene.classList.add('pulse');
            }
            if (scenes[index].id === 'scene-names') {
                scene.classList.add('shimmer');
            }
            if (scenes[index].id === 'scene-heart') {
                isHeartScene = true;
                scene.classList.add('heart-beat');
                initHeartParticles();
            } else {
                isHeartScene = false;
            }

            // Handle messages scene
            if (scenes[index].id === 'scene-messages') {
                messageIndex = 0;
                messageStartTime = Date.now();
                showNextMessage();
            }

            // Handle countdown
            if (scenes[index].id === 'scene-countdown') {
                startCountdown();
            }

            sceneStartTime = Date.now();
        }

        function startCountdown() {
            let count = 3;
            const el = document.getElementById('countdown-num');
            el.textContent = count;

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    el.textContent = count;
                    el.classList.remove('fade-in');
                    void el.offsetWidth; // trigger reflow
                    el.classList.add('fade-in');
                } else {
                    clearInterval(interval);
                }
            }, 1000);
        }

        function showNextMessage() {
            const msgEl = document.getElementById('message-display');
            if (messageIndex < messages.length) {
                msgEl.textContent = messages[messageIndex];
                msgEl.classList.remove('float-up');
                void msgEl.offsetWidth;
                msgEl.classList.add('float-up');
                messageIndex++;
                setTimeout(showNextMessage, MESSAGE_DISPLAY_TIME);
            }
        }

        // Heart particles for final scene
        function initHeartParticles() {
            heartParticles = [];
            for (let i = 0; i < 50; i++) {
                heartParticles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 3 + 1,
                    speedY: Math.random() * 2 + 0.5,
                    speedX: (Math.random() - 0.5) * 1,
                    opacity: Math.random(),
                    color: ['#ff1493', '#ff69b4', '#ffb6c1', '#ffc0cb'][Math.floor(Math.random() * 4)]
                });
            }
        }

        function drawHeartParticles() {
            heartParticles.forEach(p => {
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                p.y -= p.speedY;
                p.x += p.speedX;
                p.opacity -= 0.005;

                if (p.y < 0 || p.opacity <= 0) {
                    p.y = h + 10;
                    p.x = Math.random() * w;
                    p.opacity = 1;
                }
            });
            ctx.globalAlpha = 1;
        }

        // ===================== MAIN LOOP =====================
        function drawMatrix() {
            // Fade effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, w, h);

            // If heart scene, make matrix more transparent
            if (isHeartScene) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.fillRect(0, 0, w, h);
            }

            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];

                // Pink/magenta colors for love theme
                const colors = ['#ff1493', '#ff69b4', '#ffb6c1', '#ff85c2', '#ff5da0', '#ff2d8a'];
                const color = colors[Math.floor(Math.random() * colors.length)];

                ctx.fillStyle = color;

                // Random brightness
                const brightness = Math.random();
                if (brightness > 0.9) {
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 10;
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                // Reset drop
                if (drops[i] * fontSize > h && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i]++;
            }

            ctx.shadowBlur = 0;

            if (isHeartScene) {
                drawHeartParticles();
            }
        }

        function gameLoop() {
            drawMatrix();

            // Scene management
            const now = Date.now();
            const elapsed = now - sceneStartTime;

            if (currentScene < scenes.length - 1 && elapsed > scenes[currentScene].duration) {
                currentScene++;
                showScene(currentScene);
            }

            requestAnimationFrame(gameLoop);
        }

        // Start
        showScene(0);
        gameLoop();

        // Add sparkle effects randomly
        setInterval(() => {
            if (Math.random() > 0.7) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1500);
            }
        }, 500);

        // Click to advance scene (optional)
        document.addEventListener('click', () => {
            if (currentScene < scenes.length - 1) {
                currentScene++;
                showScene(currentScene);
            }
        });
    </script>
</body>
</html>
