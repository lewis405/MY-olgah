<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Request</title>
<style>
    body {
        background: linear-gradient(to right, #ff9a9e, #fad0c4);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        flex-direction: column;
        text-align: center;
        color: #fff;
        overflow: hidden;
    }

    h1 {
        font-size: 3em;
        margin-bottom: 10px;
        text-shadow: 2px 2px 5px #ff6f91;
    }

    p {
        font-size: 1.5em;
        margin-bottom: 30px;
        text-shadow: 1px 1px 3px #ff6f91;
    }

    button {
        background: #ff6f91;
        border: none;
        padding: 15px 30px;
        margin: 10px;
        font-size: 1.2em;
        border-radius: 50px;
        cursor: pointer;
        transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
        color: #fff;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    button:hover {
        transform: scale(1.1);
        background: #ff3f6f;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    #celebration {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background-color: rgba(0,0,0,0.7);
        z-index: 10;
    }

    #celebration h1 {
        font-size: 3em;
        color: #FFD700;
        text-shadow: 2px 2px 10px #ff69b4;
    }

    video {
        max-width: 80%;
        border-radius: 10px;
        margin-top: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
</style>
</head>
<body>

<h1>Hey Olga ❤️</h1>
<p>Will you be my Valentine?</p>
<button id="yesBtn">Yes 💖</button>
<button onclick="alert('It’s okay 😄 Maybe next time')">Yes but shy 😅</button>

<div id="celebration">
    <h1>Yaaay! ❤️ I’m so happy!</h1>
    <video autoplay muted loop>
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

<script>
document.getElementById('yesBtn').onclick = () => {
    document.getElementById('celebration').style.display = 'flex';
};
</script>

</body>
</html>
